<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据总览 · Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0d1017; --card:#161a23; --card2:#1c2230; --line:#232a36;
    --fg:#e6e9ef; --dim:#8b94a7; --red:#ff4d5e; --gold:#ffcc4d;
    --blue:#4dabff; --green:#3ddc84; --purple:#b18cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:28px 20px 48px;line-height:1.5}
  .wrap{max-width:1160px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px}
  header h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  header h1 span{color:var(--red)}
  .updated{color:var(--dim);font-size:13px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .kpi .label{color:var(--dim);font-size:12.5px;letter-spacing:.4px}
  .kpi .value{font-size:26px;font-weight:700;margin:6px 0 4px;font-variant-numeric:tabular-nums}
  .kpi .sub{color:var(--dim);font-size:12px}
  .kpi.err{border-color:#5a2530}
  .kpi.err .value{color:var(--red);font-size:15px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .panel h2{font-size:14px;font-weight:600;color:var(--dim);letter-spacing:.5px;margin-bottom:12px;text-transform:uppercase}
  .chart{height:260px}
  ul.rows{list-style:none}
  ul.rows li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  ul.rows li:last-child{border-bottom:0}
  ul.rows .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul.rows .val{color:var(--gold);font-variant-numeric:tabular-nums;flex-shrink:0}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:26px}
  footer code{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>数据总览 <span>·</span> Dashboard</h1>
    <div class="updated" id="updated">加载中…</div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="panel"><h2>GitHub 提交趋势</h2><div class="chart" id="chartCommits"></div></div>
    <div class="panel"><h2>语雀 · 近 30 天活跃</h2><div class="chart" id="chartYuque"></div></div>
  </section>

  <section class="grid">
    <div class="panel"><h2>GitHub · Star 榜</h2><ul class="rows" id="listStars"></ul></div>
    <div class="panel"><h2>GitHub · 最近活跃</h2><ul class="rows" id="listActive"></ul></div>
  </section>

  <footer>数据源：GitHub + 语雀 · 采集脚本 <code>code/data-dashboard/collect.py</code></footer>
</div>

<script>
const DATA = {"collected_at": "2026-10-08T07:59:14.974879+00:00", "sources": {"github": {"source": "github", "user": {"login": "yehuoshun", "name": "yehuoshun", "public_repos": 41, "private_repos": 5, "followers": 2}, "repos": {"total": 46, "stars_total": 18, "top_starred": [{"name": "yuque-ai-mcp", "stars": 7, "private": false}, {"name": "czn-auto", "stars": 7, "private": false}, {"name": "yuque-migration-skill", "stars": 2, "private": false}, {"name": "slay-the-spire-2-mod-skill", "stars": 1, "private": false}, {"name": "STS2-ShunMod", "stars": 1, "private": false}], "recent_active": [{"name": "yuque-ai-mcp", "pushed_at": "2026-10-08", "private": false}, {"name": "yehuoshun-notify", "pushed_at": "2026-10-08", "private": false}, {"name": "football-copy-check", "pushed_at": "2026-10-08", "private": true}, {"name": "Dragon-Cliff", "pushed_at": "2026-10-07", "private": false}, {"name": "novel-writer-skill", "pushed_at": "2026-10-07", "private": false}]}, "commits": {"d1": 9, "d7": 296, "d30": 725, "d365": 3272}, "open_pr": 1, "open_issue": 18, "collected_at": "2026-10-08T07:59:14.974897+00:00"}, "yuque": {"source": "yuque", "user": {"login": "yehuoshun"}, "overview": {"books_all": 595, "books_30d": 137, "docs_all": 500451, "docs_30d": 53495, "notes_all": 10485, "words_all": 22023998719, "words_30d": 89289093, "days_since_join": 1751}, "editing": {"edit_times_all": 573183, "edit_times_30d": 54726, "edit_days_all": 1362, "edit_days_30d": 25}, "engagement": {"liked_all": 7358}, "collected_at": "2026-10-08T07:59:25.685560+00:00"}}};

function num(n){ n = Number(n)||0; return n.toLocaleString('en-US'); }
function big(n){
  n = Number(n)||0;
  if(n >= 1e8) return (n/1e8).toFixed(2).replace(/\.?0+$/,'') + ' 亿';
  if(n >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'') + ' 万';
  return n.toLocaleString('en-US');
}
function $(id){ return document.getElementById(id); }

const src = (DATA && DATA.sources) || {};
const gh = src.github || {};
const yq = src.yuque || {};

/* ---------- 更新时间 ---------- */
(function(){
  if(DATA && DATA.collected_at){
    const d = new Date(DATA.collected_at);
    $('updated').textContent = '最后更新：' + d.toLocaleString('zh-CN', {hour12:false});
  }
})();

/* ---------- KPI 卡片 ---------- */
(function(){
  const cards = [];
  if(gh.error){ cards.push({label:'GitHub', err:gh.error}); }
  else if(gh.user){
    cards.push({label:'GitHub 仓库', value:num(gh.repos.total), sub:`公开 ${gh.user.public_repos} · 私有 ${gh.user.private_repos}`});
    cards.push({label:'近 7 天提交', value:num(gh.commits.d7), sub:`近 30 天 ${num(gh.commits.d30)}`});
    cards.push({label:'待办', value:num((gh.open_pr||0)+(gh.open_issue||0)), sub:`PR ${num(gh.open_pr)} · Issue ${num(gh.open_issue)}`});
  }
  if(yq.error){ cards.push({label:'语雀', err:yq.error}); }
  else if(yq.overview){
    cards.push({label:'语雀知识库', value:num(yq.overview.books_all), sub:`近 30 天新增 ${num(yq.overview.books_30d)}`});
    cards.push({label:'语雀文档', value:big(yq.overview.docs_all), sub:`近 30 天 ${big(yq.overview.docs_30d)}`});
    cards.push({label:'累计字数', value:big(yq.overview.words_all), sub:`近 30 天 ${big(yq.overview.words_30d)}`});
  }
  $('kpis').innerHTML = cards.map(c => c.err
    ? `<div class="kpi err"><div class="label">${c.label}</div><div class="value">采集失败</div><div class="sub">${c.err}</div></div>`
    : `<div class="kpi"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="sub">${c.sub||''}</div></div>`
  ).join('');
})();

/* ---------- 图表 ---------- */
function chart(id, option){
  if(!window.echarts){ $(id).innerHTML = '<div style="color:#8b94a7;font-size:13px;padding-top:20px">图表库未加载（离线）</div>'; return; }
  const el = $(id); const c = echarts.init(el, null, {renderer:'canvas'});
  c.setOption(option); window.addEventListener('resize', ()=>c.resize());
}

if(gh.commits){
  chart('chartCommits', {
    grid:{left:48,right:18,top:24,bottom:34},
    tooltip:{trigger:'axis'},
    xAxis:{type:'category', data:['近1天','近7天','近30天','近一年'], axisLine:{lineStyle:{color:'#232a36'}}, axisLabel:{color:'#8b94a7'}},
    yAxis:{type:'value', splitLine:{lineStyle:{color:'#1c2230'}}, axisLabel:{color:'#8b94a7'}},
    series:[{type:'bar', data:[gh.commits.d1, gh.commits.d7, gh.commits.d30, gh.commits.d365],
      itemStyle:{color:'#ff4d5e', borderRadius:[5,5,0,0]}, barWidth:'46%',
      label:{show:true, position:'top', color:'#e6e9ef', fontSize:11}}]
  });
}
if(yq.overview){
  chart('chartYuque', {
    grid:{left:52,right:18,top:24,bottom:34},
    tooltip:{trigger:'axis'},
    xAxis:{type:'category', data:['新增知识库','文档','编辑次数','编辑天数'], axisLine:{lineStyle:{color:'#232a36'}}, axisLabel:{color:'#8b94a7'}},
    yAxis:{type:'value', splitLine:{lineStyle:{color:'#1c2230'}}, axisLabel:{color:'#8b94a7'}},
    series:[{type:'bar',
      data:[yq.overview.books_30d, yq.overview.docs_30d, yq.editing.edit_times_30d, yq.editing.edit_days_30d],
      itemStyle:{color:'#4dabff', borderRadius:[5,5,0,0]}, barWidth:'46%',
      label:{show:true, position:'top', color:'#e6e9ef', fontSize:11, formatter:p=> big(p.value)}}]
  });
}

/* ---------- 列表 ---------- */
function rows(id, arr, fmt){
  $(id).innerHTML = (arr||[]).map(it => fmt(it)).join('') || '<li style="color:#8b94a7">无数据</li>';
}
if(gh.repos){
  rows('listStars', gh.repos.top_starred, r =>
    `<li><span class="name">${r.name}${r.private?'<span class="tag">私有</span>':''}</span><span class="val">★ ${num(r.stars)}</span></li>`);
  rows('listActive', gh.repos.recent_active, r =>
    `<li><span class="name">${r.name}${r.private?'<span class="tag">私有</span>':''}</span><span class="val">${r.pushed_at||'-'}</span></li>`);
}
</script>
</body>
</html>
