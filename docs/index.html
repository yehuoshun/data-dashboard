<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据总览 · Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0b0e14; --surface:#141821; --surface-2:#1a2029; --border:#232b3a;
    --text:#e8ecf3; --muted:#8b96a8; --muted-2:#5f6b7d;
    --github:#58a6ff; --yuque:#00c46a;
    --radius:14px; --gap:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:32px 22px 56px;
  }
  .wrap{max-width:1120px;margin:0 auto}

  /* ---------- Header ---------- */
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:26px}
  header h1{font-size:23px;font-weight:700;letter-spacing:.3px}
  header h1 em{font-style:normal;color:var(--muted-2);font-weight:400;margin:0 6px}
  .updated{color:var(--muted);font-size:12.5px}

  /* ---------- 数据源分区 ---------- */
  .source{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 22px 22px;margin-bottom:24px;position:relative;overflow:hidden;
  }
  .source::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .source[data-source="github"]{--accent:var(--github)}
  .source[data-source="yuque"]{--accent:var(--yuque)}

  .source-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-left:6px}
  .badge{
    font-size:13px;font-weight:700;letter-spacing:.4px;padding:4px 12px;border-radius:8px;
    color:#0b0e14;background:var(--accent);
  }
  .source-sub{color:var(--muted);font-size:12.5px}
  .source-status{margin-left:auto;font-size:12px;color:var(--muted-2)}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:15px 16px}
  .kpi .label{color:var(--muted);font-size:12.5px}
  .kpi .value{font-size:27px;font-weight:700;margin:5px 0 3px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .kpi .sub{color:var(--muted-2);font-size:11.5px}
  .kpi.long .value{font-size:19px}
  .kpi.err{border-color:#5a2530}
  .kpi.err .value{color:#ff5c6c;font-size:14px;font-weight:600}

  /* ---------- 面板 ---------- */
  .panels{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
  @media(max-width:820px){.panels{grid-template-columns:1fr}}
  .panel{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:15px 17px}
  .panel h2{
    font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.6px;
    margin-bottom:12px;display:flex;align-items:center;gap:7px;
  }
  .panel h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .chart{height:250px}
  ul.rows{list-style:none}
  ul.rows li{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
  ul.rows li:last-child{border-bottom:0}
  ul.rows .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
  ul.rows .val{color:var(--text);font-variant-numeric:tabular-nums;flex-shrink:0;font-weight:600}
  .tag{font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 5px;margin-left:7px;font-weight:400}
  .empty{color:var(--muted-2);font-size:13px;padding:6px 0}

  /* ---------- Footer ---------- */
  footer{color:var(--muted-2);font-size:12px;text-align:center;margin-top:30px}
  footer code{color:var(--muted);background:var(--surface);padding:2px 6px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>数据总览<em>·</em>Dashboard</h1>
    <div class="updated" id="updated">加载中…</div>
  </header>

  <div id="sources"></div>

  <footer>数据源：GitHub + 语雀 · 采集脚本 <code>code/data-dashboard/collect.py</code></footer>
</div>

<script>
const DATA = {"collected_at": "2026-10-10T16:00:07.183982+00:00", "sources": {"github": {"source": "github", "user": {"login": "yehuoshun", "name": "yehuoshun", "public_repos": 42, "private_repos": 5, "followers": 2}, "repos": {"total": 47, "stars_total": 18, "top_starred": [{"name": "yuque-ai-mcp", "stars": 7, "private": false}, {"name": "czn-auto", "stars": 7, "private": false}, {"name": "yuque-migration-skill", "stars": 2, "private": false}, {"name": "STS2-ShunMod", "stars": 1, "private": false}, {"name": "slay-the-spire-2-mod-skill", "stars": 1, "private": false}], "recent_active": [{"name": "novel-writer-skill", "pushed_at": "2026-10-10", "private": false}, {"name": "STS2-ShunMod", "pushed_at": "2026-10-10", "private": false}, {"name": "yuque-ai-mcp", "pushed_at": "2026-10-10", "private": false}, {"name": "yuque-import-skill", "pushed_at": "2026-10-10", "private": true}, {"name": "football-copy-check", "pushed_at": "2026-10-10", "private": true}]}, "commits": {"total": 3387, "d1": 37, "d7": 306, "d30": 815, "d365": 3387}, "open_pr": 0, "open_issue": 18, "collected_at": "2026-10-10T16:00:07.184002+00:00"}, "yuque": {"source": "yuque", "user": {"login": "yehuoshun"}, "overview": {"books_all": 602, "books_30d": 141, "docs_all": 501734, "docs_30d": 52985, "notes_all": 10520, "words_all": 22025364862, "words_30d": 86035903, "days_since_join": 1754}, "editing": {"edit_times_all": 574544, "edit_times_30d": 54232, "edit_days_all": 1364, "edit_days_30d": 25}, "engagement": {"liked_all": 7358}, "collected_at": "2026-10-10T16:00:20.892531+00:00"}}};

const $ = id => document.getElementById(id);
const num = n => (Number(n)||0).toLocaleString('en-US');
const big = n => {
  n = Number(n)||0;
  if(n >= 1e8) return (n/1e8).toFixed(2).replace(/\.?0+$/,'') + ' 亿';
  if(n >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'') + ' 万';
  return n.toLocaleString('en-US');
};
const src = (DATA && DATA.sources) || {};

/* ---------- 更新时间 ---------- */
if(DATA && DATA.collected_at){
  $('updated').textContent = '最后更新：' + new Date(DATA.collected_at).toLocaleString('zh-CN',{hour12:false});
}

/* ---------- 通用渲染 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function kpiCard(c){
  if(c.err) return `<div class="kpi err"><div class="label">${esc(c.label)}</div><div class="value">采集失败</div><div class="sub">${esc(c.err)}</div></div>`;
  const long = String(c.value).replace(/[^0-9]/g,'').length > 9 ? ' long' : '';
  return `<div class="kpi${long}"><div class="label">${esc(c.label)}</div><div class="value">${c.value}</div><div class="sub">${esc(c.sub||'')}</div></div>`;
}

function sourceBlock(id, name, sub, kpis, panels, collectedAt){
  return `
  <section class="source" data-source="${id}">
    <div class="source-head">
      <span class="badge">${esc(name)}</span>
      <span class="source-sub">${esc(sub)}</span>
      <span class="source-status">${collectedAt ? '采集于 '+new Date(collectedAt).toLocaleTimeString('zh-CN',{hour12:false}) : ''}</span>
    </div>
    <div class="kpis">${kpis.map(kpiCard).join('')}</div>
    <div class="panels">${panels.join('')}</div>
  </section>`;
}

function panel(title, body, chartId){
  const inner = chartId ? `<div class="chart" id="${chartId}"></div>` : `<ul class="rows">${body}</ul>`;
  return `<div class="panel"><h2>${esc(title)}</h2>${inner}</div>`;
}

function li(name, val, tag){
  return `<li><span class="name">${esc(name)}${tag?'<span class="tag">'+esc(tag)+'</span>':''}</span><span class="val">${val}</span></li>`;
}

/* ---------- 图表 ---------- */
function chart(id, option){
  if(!window.echarts){ $(id).innerHTML = '<div class="empty">图表库未加载</div>'; return; }
  const c = echarts.init($(id), null, {renderer:'canvas'});
  c.setOption(option);
  window.addEventListener('resize', ()=>c.resize());
}
const axisCommon = {
  axisLine:{lineStyle:{color:'#232b3a'}}, axisLabel:{color:'#8b96a8', fontSize:11}, axisTick:{show:false}
};

/* ---------- 组装：GitHub ---------- */
const gh = src.github;
const blocks = [];

if(gh && gh.error){
  blocks.push(sourceBlock('github','GitHub','采集失败',[{label:'GitHub', err:gh.error}],[],null));
}else if(gh && gh.user){
  const kpis = [
    {label:'仓库', value:num(gh.repos.total), sub:`公开 ${gh.user.public_repos} · 私有 ${gh.user.private_repos}`},
    {label:'累计提交', value:num(gh.commits.total), sub:`近一年 ${num(gh.commits.d365)}`},
    {label:'近 7 天提交', value:num(gh.commits.d7), sub:`近 30 天 ${num(gh.commits.d30)}`},
    {label:'待办', value:num((gh.open_pr||0)+(gh.open_issue||0)), sub:`PR ${num(gh.open_pr)} · Issue ${num(gh.open_issue)}`},
    {label:'总 Star', value:num(gh.repos.stars_total), sub:`关注者 ${num(gh.user.followers)}`},
  ];
  const starRows = (gh.repos.top_starred||[]).map(r=>li(r.name,'★ '+num(r.stars), r.private?'私有':'')).join('') || '<li class="empty">无数据</li>';
  const activeRows = (gh.repos.recent_active||[]).map(r=>li(r.name, esc(r.pushed_at||'-'), r.private?'私有':'')).join('') || '<li class="empty">无数据</li>';
  const panels = [
    panel('提交趋势（近 1/7/30/365 天）','','chartCommits'),
    panel('Star 榜', starRows),
    panel('最近活跃仓库', activeRows),
  ];
  blocks.push(sourceBlock('github','GitHub','yehuoshun · 编程活跃度',kpis,panels,gh.collected_at));
}

/* ---------- 组装：语雀 ---------- */
const yq = src.yuque;
if(yq && yq.error){
  blocks.push(sourceBlock('yuque','语雀','采集失败',[{label:'语雀', err:yq.error}],[],null));
}else if(yq && yq.overview){
  const ov = yq.overview, ed = yq.editing;
  const kpis = [
    {label:'知识库', value:num(ov.books_all), sub:`近 30 天新增 ${num(ov.books_30d)}`},
    {label:'文档', value:num(ov.docs_all), sub:`近 30 天 ${num(ov.docs_30d)}`},
    {label:'累计字数', value:num(ov.words_all), sub:`近 30 天 ${num(ov.words_30d)}`},
    {label:'小记', value:num(ov.notes_all), sub:`加入 ${num(ov.days_since_join)} 天`},
  ];
  const panels = [
    panel('近 30 天活跃','','chartYuque'),
    panel('累计编辑', [
      li('编辑次数', num(ed.edit_times_all), ''),
      li('近 30 天编辑', num(ed.edit_times_30d), ''),
      li('编辑天数', num(ed.edit_days_all), ''),
      li('获赞', num(yq.engagement.liked_all), ''),
    ].join('')),
  ];
  blocks.push(sourceBlock('yuque','语雀','yehuoshun · 知识库运营',kpis,panels,yq.collected_at));
}

$('sources').innerHTML = blocks.join('') || '<div class="empty">暂无数据</div>';

/* ---------- 画图 ---------- */
if(gh && gh.commits){
  chart('chartCommits', {
    grid:{left:52,right:16,top:26,bottom:32},
    tooltip:{trigger:'axis'},
    xAxis:Object.assign({type:'category', data:['近1天','近7天','近30天','近一年']}, axisCommon),
    yAxis:{type:'value', splitLine:{lineStyle:{color:'#232b3a'}}, axisLabel:{color:'#8b96a8', fontSize:11}},
    series:[{type:'bar', data:[gh.commits.d1,gh.commits.d7,gh.commits.d30,gh.commits.d365],
      itemStyle:{color:'#58a6ff', borderRadius:[5,5,0,0]}, barWidth:'44%',
      label:{show:true, position:'top', color:'#e8ecf3', fontSize:11}}]
  });
}
if(yq && yq.overview){
  const ov = yq.overview, ed = yq.editing;
  chart('chartYuque', {
    grid:{left:52,right:16,top:26,bottom:32},
    tooltip:{trigger:'axis'},
    xAxis:Object.assign({type:'category', data:['新增知识库','文档','编辑次数','编辑天数']}, axisCommon),
    yAxis:{type:'value', splitLine:{lineStyle:{color:'#232b3a'}}, axisLabel:{color:'#8b96a8', fontSize:11}},
    series:[{type:'bar', data:[ov.books_30d, ov.docs_30d, ed.edit_times_30d, ed.edit_days_30d],
      itemStyle:{color:'#00c46a', borderRadius:[5,5,0,0]}, barWidth:'44%',
      label:{show:true, position:'top', color:'#e8ecf3', fontSize:11, formatter:p=>num(p.value)}}]
  });
}
</script>
</body>
</html>
